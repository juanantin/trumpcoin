<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRMP — Trump Rewards My Portfolio</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header class="hero">
    <video
      class="hero-banner"
      poster="assets/header-banner-poster.jpg"
      autoplay muted loop playsinline
    >
      <source src="assets/header-banner.mp4" type="video/mp4">
      <img src="assets/header-banner-poster.jpg" alt="TRMP — Trump Rewards My Portfolio. Buy TRMP on Robinhood, earn $DJT.">
    </video>
    <h1 class="site-name">Trump Rewards My Portfolio</h1>
  </header>

  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v5c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 11v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg>
      </div>
      <div class="stat-label">FEES COLLECTED</div>
      <div class="stat-value loading" id="feesCollected">$0.00</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>
      </div>
      <div class="stat-label">$DJT DISTRIBUTED</div>
      <div class="stat-value loading" id="djtDistributed">0.00</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21,3 21,9 15,9"/></svg>
      </div>
      <div class="stat-label">ROUNDS</div>
      <div class="stat-value loading" id="rounds">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </div>
      <div class="stat-label">HOLDER COUNT</div>
      <div class="stat-value loading" id="holderCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/></svg>
      </div>
      <div class="stat-label">MARKET CAP</div>
      <div class="stat-value loading" id="marketCap">$0</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">
        <svg viewBox="0 0 24 24"><polyline points="2,12 7,12 9,6 13,18 16,12 22,12"/></svg>
      </div>
      <div class="stat-label">VOLUME 24H</div>
      <div class="stat-value loading" id="volume24h">$0</div>
    </div>
  </section>

  <section class="actions">
    <a href="#" class="btn btn-primary" id="buyBtn">
      <svg viewBox="0 0 24 24" class="btn-icon"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      BUY $TRMP
    </a>
    <a href="https://x.com/trmptoken_rh" target="_blank" rel="noopener" class="btn btn-secondary">
      <svg viewBox="0 0 24 24" class="btn-icon"><path d="M4 4l16 16M20 4 4 20"/></svg>
      X
    </a>
    <a href="#" class="btn btn-secondary" id="chartBtn">
      <svg viewBox="0 0 24 24" class="btn-icon"><rect x="4" y="12" width="3" height="8"/><rect x="10" y="7" width="3" height="13"/><rect x="16" y="3" width="3" height="17"/></svg>
      VIEW CHART
    </a>
    <button class="btn btn-secondary" id="copyCaBtn" type="button">
      <svg viewBox="0 0 24 24" class="btn-icon"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span id="copyCaLabel">COPY CA</span>
    </button>
  </section>

  <footer class="footer">
    <p class="footer-tagline">TRMP Earn <span class="accent">$DJT</span> stock.</p>
    <p class="disclaimer">Trump Rewards My Portfolio is a meme token. Not affiliated with Donald Trump or any entity.<br>Not financial advice. DYOR.</p>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>
